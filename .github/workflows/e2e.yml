# End-to-end tests of the Godot viewer on Monado. With a cached Godot build they take
# about 2 minutes, but building Godot takes about 30, so:
# - Pull requests and pushes to main run them only when something they exercise
#   changes (the layer, the viewer, the test itself).
# - Godot is built once per pinned commit, and the build is cached. Caches made on
#   main are visible to pull requests; caches made in a pull request are not visible
#   to main or other pull requests.
# - A schedule runs them twice a week. That catches changes outside this repository
#   (runner image, Monado, Mesa) and keeps the cache from expiring, since GitHub
#   evicts caches not used for 7 days.
name: E2E

on:
  push:
    branches: [main]
    paths: &relevant
      - tools/spatial-container-emulation-layer/**
      - samples/container-viewer/**
      - tests/e2e/**
      - .github/workflows/e2e.yml
  pull_request:
    paths: *relevant
  schedule:
    - cron: "17 3 * * 1,4"  # Monday and Thursday, 03:17 UTC.
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Godot master with the fix for frames skipped while a spatial container is active
  # (4.8-dev7 omits XrSpatialContainerLayerFrameEndInfoEXT on those frames). Used
  # until a Godot build with the fix is released.
  GODOT_E2E_COMMIT: c8256a8ecec068340753869e423dd478c84ef167

jobs:
  e2e:
    name: End-to-end (Godot viewer on Monado)
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v5
      - name: Install runtime and tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends monado-service libopenxr1-monado \
            mesa-vulkan-drivers xvfb xauth libx11-dev ninja-build
      - name: Build emulation layer
        run: |
          cmake -S tools/spatial-container-emulation-layer -B build-layer -G Ninja -DSCEMU_BUILD_TESTS=OFF
          cmake --build build-layer
      - name: Restore Godot build
        id: godot-cache
        uses: actions/cache/restore@v4
        with:
          path: godot-bin
          key: godot-editor-linux-${{ env.GODOT_E2E_COMMIT }}
      - name: Check out Godot
        if: steps.godot-cache.outputs.cache-hit != 'true'
        uses: actions/checkout@v5
        with:
          repository: godotengine/godot
          ref: ${{ env.GODOT_E2E_COMMIT }}
          path: godot-src
      - name: Build Godot
        if: steps.godot-cache.outputs.cache-hit != 'true'
        working-directory: godot-src
        run: |
          pipx install "scons==4.9.1"
          pipx inject scons zstandard
          scons platform=linuxbsd target=editor -j"$(nproc)" wayland=no accesskit=no module_mono_enabled=no tests=no
          mkdir -p ../godot-bin
          cp bin/godot.linuxbsd.editor.x86_64 ../godot-bin/godot
      - name: Save Godot build
        # Saved right after building, so a failing test does not throw the build away.
        if: steps.godot-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: godot-bin
          key: godot-editor-linux-${{ env.GODOT_E2E_COMMIT }}
      - name: Run end-to-end tests
        env:
          E2E_LOG_DIR: ${{ github.workspace }}/e2e-logs
        run: tests/e2e/run_viewer_e2e.sh godot-bin/godot build-layer
      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: e2e-logs
          path: e2e-logs
          if-no-files-found: ignore
