name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  GODOT_VERSION: 4.8-dev7
  # Godot master with the fix for frames skipped while a spatial container is active
  # (4.8-dev7 omits XrSpatialContainerLayerFrameEndInfoEXT on those frames). Used by
  # the end-to-end job until a Godot build with the fix is released.
  GODOT_E2E_COMMIT: c8256a8ecec068340753869e423dd478c84ef167

jobs:
  linux:
    name: Linux (${{ matrix.config.name }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        config:
          - name: Release
            build_type: Release
            flags: ""
          - name: ASan+UBSan
            build_type: Debug
            flags: -fsanitize=address,undefined -fno-omit-frame-pointer
    steps:
      - uses: actions/checkout@v5
      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ninja-build libx11-dev
      - name: Configure
        # The C++ sample also builds the emulation layer, its mock runtime and their tests.
        run: >
          set -o pipefail;
          cmake -S samples/cpp-minimal -B build -G Ninja
          -DCMAKE_BUILD_TYPE=${{ matrix.config.build_type }}
          -DCMAKE_CXX_FLAGS="${{ matrix.config.flags }}"
          -DCMAKE_EXE_LINKER_FLAGS="${{ matrix.config.flags }}"
          -DCMAKE_SHARED_LINKER_FLAGS="${{ matrix.config.flags }}"
          2>&1 | tee ci.log
      - name: Build
        run: set -o pipefail; cmake --build build 2>&1 | tee ci.log
      - name: Test
        run: set -o pipefail; ctest --test-dir build --output-on-failure 2>&1 | tee ci.log
      - name: Report failure
        # Put the end of the failing step's output in an annotation, so it is visible
        # without opening the log.
        if: failure()
        run: |
          {
            echo -n "::error title=Last output::"
            tail -n 60 ci.log | sed -e 's/%/%25/g' -e 's/\r//g' | sed ':a;N;$!ba;s/\n/%0A/g'
          } || true

  windows:
    name: Windows (MSVC)
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v5
      - name: Build
        # The C++ sample also builds the emulation layer and the unit tests.
        run: |
          cmake -S samples/cpp-minimal -B build
          cmake --build build --config Release
      - name: Unit tests
        run: ctest --test-dir build -C Release --output-on-failure
      - name: Upload binaries
        uses: actions/upload-artifact@v5
        with:
          name: windows-binaries
          path: |
            build/emulation_layer/Release/XrApiLayer_spatial_container_emulation.dll
            build/emulation_layer/Release/XrApiLayer_spatial_container_emulation.json
            build/Release/cpp_minimal.exe
            build/Release/openxr_loader.dll
          if-no-files-found: error

  godot:
    name: Godot viewer
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Download Godot
        run: |
          curl -fsSL -o godot.zip "https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}/Godot_v${GODOT_VERSION}_linux.x86_64.zip"
          unzip -q godot.zip
          echo "GODOT=$PWD/Godot_v${GODOT_VERSION}_linux.x86_64" >> "$GITHUB_ENV"
      - name: Import project
        working-directory: samples/container-viewer
        run: '"$GODOT" --headless --path . --import'
      - name: Check scripts
        working-directory: samples/container-viewer
        run: |
          set -o pipefail
          for script in $(git ls-files '*.gd'); do
            "$GODOT" --headless --path . --check-only --script "$script" 2>&1 | tee check.log
            if grep -E "SCRIPT ERROR|Parse Error" check.log; then exit 1; fi
          done
      - name: Unit tests
        working-directory: samples/container-viewer
        env:
          # The unit tests expect no OpenXR runtime.
          XR_RUNTIME_JSON: /nonexistent.json
        run: '"$GODOT" --headless --path . -s res://tests/run_tests.gd'

  lint:
    name: Lint and static analysis
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang-format-18 clang-tidy-18 shellcheck libx11-dev ninja-build
          pipx install "gdtoolkit==4.5.0"
          pipx install "editorconfig-checker==3.11.1"
          npm install --global "markdownlint-cli2@0.18.1"
          curl -fsSL -o actionlint.tgz "https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz"
          tar xzf actionlint.tgz actionlint && sudo mv actionlint /usr/local/bin/
      - name: Lint
        env:
          CLANG_FORMAT: clang-format-18
          CLANG_TIDY: clang-tidy-18
        run: set -o pipefail; scripts/lint.sh 2>&1 | tee ci.log
      - name: Report failure
        if: failure()
        run: |
          {
            echo -n "::error title=Last output::"
            grep -vE "warnings generated|^\[[0-9]+/[0-9]+\] Processing" ci.log | tail -n 60 \
              | sed -e 's/%/%25/g' -e 's/\r//g' | sed ':a;N;$!ba;s/\n/%0A/g'
          } || true

  e2e:
    name: End-to-end (Godot viewer on Monado)
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
      - name: Install runtime and tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends monado-service libopenxr1-monado \
            mesa-vulkan-drivers xvfb xauth libx11-dev ninja-build
      - name: Build emulation layer
        run: |
          cmake -S tools/spatial-container-emulation-layer -B build-layer -G Ninja -DSCEMU_BUILD_TESTS=OFF
          cmake --build build-layer
      - name: Restore Godot build
        id: godot-cache
        uses: actions/cache@v4
        with:
          path: godot-bin
          key: godot-editor-linux-${{ env.GODOT_E2E_COMMIT }}
      - name: Check out Godot
        if: steps.godot-cache.outputs.cache-hit != 'true'
        uses: actions/checkout@v5
        with:
          repository: godotengine/godot
          ref: ${{ env.GODOT_E2E_COMMIT }}
          path: godot-src
      - name: Build Godot
        if: steps.godot-cache.outputs.cache-hit != 'true'
        working-directory: godot-src
        run: |
          pipx install "scons==4.9.1"
          pipx inject scons zstandard
          scons platform=linuxbsd target=editor -j"$(nproc)" wayland=no accesskit=no module_mono_enabled=no tests=no
          mkdir -p ../godot-bin
          cp bin/godot.linuxbsd.editor.x86_64 ../godot-bin/godot
      - name: Run end-to-end tests
        env:
          E2E_LOG_DIR: ${{ github.workspace }}/e2e-logs
        run: tests/e2e/run_viewer_e2e.sh godot-bin/godot build-layer
      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: e2e-logs
          path: e2e-logs
          if-no-files-found: ignore
